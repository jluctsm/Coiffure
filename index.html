<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mon carnet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Mon carnet — clientes</title>
  <style>
    :root{color-scheme:light;--ink:#29251f;--muted:#82786f;--line:#e9e2dc;--paper:#fff;--bg:#f7f3ef;--accent:#735342;--accent2:#efe5dc;--rose:#b96d69}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .wrap{width:min(100%,760px);margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}h1{font:500 32px/1.1 Georgia,serif;margin:5px 0 0}.date-label{font-size:13px;color:var(--muted);text-align:right}
    .summary{display:flex;gap:12px;margin-bottom:22px}.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{font:500 22px Georgia,serif;display:block;margin-top:4px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 5px 20px #49321a08}.card h2{font:500 21px Georgia,serif;margin:0 0 16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}label{font-size:12px;color:var(--muted)}input{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;min-width:0}input:focus{outline:2px solid #b8957c66;border-color:#b8957c}button{font:600 14px inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px}.primary{background:var(--accent);color:white;width:100%;margin-top:14px}.actions{display:flex;gap:8px}.light{background:var(--accent2);color:var(--accent)}.small{padding:10px 12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar h2{margin:0}.search{width:100%;margin:0 0 10px}.list{display:grid;gap:9px}.entry{border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.entry-name{font-weight:650}.entry-meta{font-size:13px;color:var(--muted);margin-top:3px}.entry-price{font-weight:650;white-space:nowrap}.entry-controls{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:8px}.delete{color:var(--rose);background:#fbefee}.empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:14px}.hint{font-size:12px;color:var(--muted);text-align:center;margin:16px 0 0}
    @media(min-width:600px){.wrap{padding:36px 24px}.formgrid{grid-template-columns:repeat(4,1fr)}.field.wide{grid-column:span 2}}
    @media print{body{background:#fff;color:#000;padding:0}.wrap{width:100%;padding:0}.top{margin-bottom:14px}h1{font-size:26px}.summary{margin-bottom:12px}.stat,.card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}.form-card,.toolbar .actions,.search,.entry-controls,.hint{display:none!important}.card{padding:12px;margin-bottom:10px}.list{gap:0}.entry{border:0;border-bottom:1px solid #ddd;border-radius:0;padding:9px 4px;grid-template-columns:1fr auto}.entry-meta{color:#444}.print-title{display:block!important}.entry-controls{display:none}}
    .print-title{display:none}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><div class="brand">Carnet de rendez-vous</div><h1>Mes clients</h1></div><div class="date-label" id="today"></div></header>
  <section class="summary"><div class="stat"><span>Clients enregistres</span><strong id="count">0</strong></div><div class="stat"><span>Total des prestations</span><strong id="total">0,00 €</strong></div></section>
  <section class="card form-card"><h2>Ajouter un client</h2><form id="form"><div class="formgrid">
    <div class="field"><label for="date">Date</label><input id="date" type="date" required></div>
    <div class="field"><label for="nom">Nom</label><input id="nom" autocomplete="family-name" placeholder="Dupont" required></div>
    <div class="field"><label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name" placeholder="Camille" required></div>
    <div class="field"><label for="coiffure">Coiffure</label><input id="coiffure" placeholder="Coupe, brushing…" required></div>
    <div class="field"><label for="prix">Prix (€)</label><input id="prix" type="number" min="0" step="0.01" inputmode="decimal" placeholder="35,00" required></div>
  </div><button class="primary" type="submit">＋　Enregistrer la cliente</button></form></section>
  <section class="card"><div class="toolbar"><h2>Le carnet</h2><div class="actions"><button class="light small" id="print">Imprimer</button></div></div><div class="print-title"><strong>Liste des clientes</strong> · imprimé le <span id="printDate"></span></div><input id="search" class="search" type="search" placeholder="Rechercher une cliente…" aria-label="Rechercher"><div id="list" class="list"></div></section>
  <p class="hint">Vos données restent enregistrées sur cet appareil.</p>
</main>
<script>
const KEY='mon-carnet-clientes-v1';let records=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id),today=new Date();const localDate=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
$('date').value=localDate;$('today').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(today);$('printDate').textContent=new Intl.DateTimeFormat('fr-FR').format(today);
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n);
function save(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function render(){const q=$('search').value.trim().toLocaleLowerCase('fr');let shown=records.filter(r=>`${r.nom} ${r.prenom} ${r.coiffure}`.toLocaleLowerCase('fr').includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('count').textContent=records.length;$('total').textContent=money(records.reduce((s,r)=>s+Number(r.prix),0));$('list').innerHTML=shown.length?shown.map(r=>`<article class="entry"><div><div class="entry-name">${esc(r.prenom)} ${esc(r.nom)}</div><div class="entry-meta">${new Intl.DateTimeFormat('fr-FR').format(new Date(r.date+'T12:00:00'))} · ${esc(r.coiffure)}</div></div><div class="entry-price">${money(Number(r.prix))}</div><div class="entry-controls"><button class="delete small" data-del="${r.id}">Supprimer</button></div></article>`).join(''):'<div class="empty">Aucune cliente pour le moment.<br>Ajoutez votre première prestation ci-dessus.</div>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('form').addEventListener('submit',e=>{e.preventDefault();records.push({id:crypto.randomUUID(),date:$('date').value,nom:$('nom').value.trim(),prenom:$('prenom').value.trim(),coiffure:$('coiffure').value.trim(),prix:Number($('prix').value)});save();e.target.reset();$('date').value=localDate;$('nom').focus()});
$('list').addEventListener('click',e=>{const id=e.target.dataset.del;if(id){records=records.filter(r=>r.id!==id);save()}});$('search').addEventListener('input',render);$('print').addEventListener('click',()=>window.print());render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
